[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-agent-development-framework"
version = "0.1.0"
description = "A sanitized reference validator for evidence-backed agent handoffs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Noah Feldman" }]
dependencies = []

[project.scripts]
vadf = "vadf.cli:main"

[tool.setuptools]
packages = ["vadf"]
